[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "acaj-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai==3.46.0",
    "pydantic==2.14.3",
    "pypdf==6.1.3",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1"]

[project.scripts]
acaj-ai = "acaj_ai.cli:main"

[tool.setuptools.packages.find]
include = ["acaj_ai*"]
namespaces = true

[tool.setuptools.package-data]
acaj_ai = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["acaj_ai", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
